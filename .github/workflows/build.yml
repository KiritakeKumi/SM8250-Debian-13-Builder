name: Build Debian 13 Image

# 手动触发，按需选择内核版本 / 设备树来源 / 是否带网卡修复；
# 推送到 main 时也会自动构建并发布 release。
on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Linux kernel version (kernel.org tarball)"
        required: true
        # NOTE: this default and every `inputs.kernel_version || '...'` fallback
        # below must stay in sync -- scripts/validate.sh enforces it. The
        # fallbacks are what push events use, since `inputs` is empty there.
        default: "7.2"
        type: string
      dtb_source:
        description: "Device tree source"
        required: true
        default: "upstream-armbian"
        type: choice
        options:
          - upstream-armbian
          - upstream-vendor-dg
          - custom
      variants:
        description: "Which board variants to build"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - tc-eb5
          - lite-865
      rootfs_size_mb:
        description: "rootfs image size in MiB (must be >= real UFS rootfs partition)"
        required: true
        default: "6000"
        type: string
      hostname:
        description: "Target hostname"
        required: true
        default: "nico-sm8250"
        type: string
      root_password:
        description: "root password (changed on first login)"
        required: true
        default: "root"
        type: string
      enable_ssh:
        description: "Enable sshd in the image"
        required: true
        default: true
        type: boolean
      extra_packages:
        description: "Extra packages, space separated"
        required: false
        default: ""
        type: string
      make_default_user:
        description: "Create a normal user (debian) with sudo"
        required: true
        default: true
        type: boolean
      build_release_name:
        description: "Release label used in artifact filenames"
        required: true
        default: "trixie"
        type: string
      publish_release:
        description: "Also publish the images as a GitHub pre-release"
        required: true
        default: false
        type: boolean
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build.yml"
      - "config/**"
      - "dts/**"
      - "modules/**"
      - "scripts/**"

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Cheap first gate: make sure the DTS + overlay actually compiles, and that
  # the boot image packer is correct, before we spend an hour building a kernel.
  validate:
    name: Validate device tree and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      variants: ${{ steps.variants.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      # Which board variants this run builds. They differ ONLY in the device
      # tree and in whether the out-of-tree helper is installed:
      #
      #   tc-eb5    NIC-fix overlay applied. The overlay rewrites the root
      #             compatible to "thundercomm,eb5" and adds the PCIe1
      #             sequencer node, which is what eb5-board.c gates on.
      #             ASM2806 + 2x RTL8168 behind PCIe1.
      #   lite-865  No overlay, no helper module. Root compatible stays
      #             "qcom,qrb5165-rb5", so even a stray modprobe cannot touch
      #             the board GPIOs: eb5_check_board() returns -EINVAL before
      #             eb5_get_gpios() runs. NIC is a USB RTL8153.
      #
      # This is why one image cannot serve both boards: a tc-eb5 boot.img
      # makes any board claim to be an EB5.
      - name: Resolve which variants to build
        id: variants
        run: |
          set -euo pipefail
          # `inputs` is empty on push events, so the default builds both.
          sel="${{ inputs.variants || 'both' }}"
          case "$sel" in
            tc-eb5)   list='["tc-eb5"]' ;;
            lite-865) list='["lite-865"]' ;;
            both)     list='["tc-eb5","lite-865"]' ;;
            *) echo "ERROR: unknown variants selector '$sel'" >&2; exit 1 ;;
          esac
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "will build: $list"

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            device-tree-compiler gcc python3 curl ca-certificates

      - name: Fetch kernel DT headers (sparse, retried)
        run: |
          set -euo pipefail
          KVER="${{ inputs.kernel_version || '7.2' }}"

          # Resolve the tag + repo with the shared helper. Doing this inline
          # used to be wrong for a bare "7.2": ${KVER%.*} stripped ".2" and
          # produced the tag "v7", which does not exist:
          #   fatal: couldn't find remote ref refs/tags/v7
          # Stable point releases (6.18.35, 7.2.6) are also only tagged in
          # gregkh/linux, not torvalds/linux.
          eval "$(bash scripts/resolve-kernel-ref.sh "$KVER" --format=env)"
          echo "version: $KVER"
          echo "tag:     $KERNEL_TAG"
          echo "repo:    $KERNEL_REPO"
          echo "kind:    $KERNEL_KIND"

          DEST="$PWD/kdts"
          rm -rf "$DEST"; mkdir -p "$DEST"
          cd "$DEST"
          git init -q .
          git remote add origin "$KERNEL_REPO"
          git config core.sparseCheckout true
          git sparse-checkout init --cone
          # NOTE: include/uapi is REQUIRED. include/dt-bindings/input/linux-event-codes.h
          # is a symlink into include/uapi/linux/input-event-codes.h, and pm8150.dtsi
          # pulls it in via dt-bindings/input/input.h. Without it the preprocessor
          # fails with "linux-event-codes.h: No such file or directory".
          git sparse-checkout set \
              include/dt-bindings \
              include/uapi \
              arch/arm64/boot/dts/qcom \
              scripts/dtc/include-prefixes

          # github can be flaky; retry, then fall back to torvalds/linux
          fetched=0
          for attempt in 1 2 3 4 5; do
            if git fetch --depth 1 --no-tags \
                 origin "refs/tags/$KERNEL_TAG:refs/tags/$KERNEL_TAG" 2>&1; then
              fetched=1
              break
            fi
            echo "fetch attempt $attempt failed, retrying..."
            sleep 15
          done

          if [[ $fetched -ne 1 ]]; then
            echo "could not fetch $KERNEL_TAG from $KERNEL_REPO"
            echo "trying torvalds/linux as a fallback..."
            git remote set-url origin https://github.com/torvalds/linux.git
            for attempt in 1 2 3 4 5; do
              if git fetch --depth 1 --no-tags \
                   origin "refs/tags/$KERNEL_TAG:refs/tags/$KERNEL_TAG" 2>&1; then
                fetched=1
                break
              fi
              echo "fallback attempt $attempt failed, retrying..."
              sleep 15
            done
          fi

          if [[ $fetched -ne 1 ]]; then
            cat >&2 <<EOF
          ERROR: tag $KERNEL_TAG not found in either repo.

          Tried:
            $KERNEL_REPO
            https://github.com/torvalds/linux.git

          Check that the version exists:
            https://cdn.kernel.org/pub/linux/kernel/$KERNEL_SERIES/
          EOF
            exit 1
          fi

          git checkout -q "refs/tags/$KERNEL_TAG"

          echo "checked out: $(git describe --tags 2>/dev/null || echo "$KERNEL_TAG")"
          echo "dt-bindings headers: $(find include/dt-bindings -name '*.h' | wc -l)"
          echo "uapi headers:        $(find include/uapi -name '*.h' | wc -l)"
          echo "qcom dtsi files:     $(ls arch/arm64/boot/dts/qcom/*.dtsi | wc -l)"

          # Fail fast if a symlinked dt-binding lost its target.
          for h in include/dt-bindings/input/linux-event-codes.h \
                   include/dt-bindings/clock/qcom,dispcc-sm8150.h \
                   include/dt-bindings/clock/qcom,dispcc-sm8350.h \
                   include/dt-bindings/clock/qcom,sm8650-dispcc.h ; do
            if [[ -e "$h" ]]; then
              echo "  OK   $h"
            else
              echo "  BROKEN SYMLINK: $h -> $(readlink "$h" 2>/dev/null || echo '?')" >&2
              exit 1
            fi
          done

      - name: Validate DTS + overlay
        run: |
          set -euo pipefail
          # Both variants must compile, and the lite-865 tree must NOT claim
          # to be an EB5 -- that is the only thing keeping the helper module
          # away from the GPIOs on a board with no ASM2806.
          bash scripts/check-dts.sh "$PWD/kdts"
          echo
          bash scripts/check-dts.sh "$PWD/kdts" --no-overlay

      - name: Self-test the boot image packer
        run: |
          set -euo pipefail
          # Exercises page padding, page-aligned blobs, an empty ramdisk,
          # over-long cmdline rejection and the optional second stage.
          python3 scripts/test-mkbootimg.py

      - name: Lint shell scripts and repo wiring
        run: |
          set -euo pipefail
          bash scripts/validate.sh

  build:
    name: Build ${{ matrix.variant }} (${{ inputs.kernel_version || '7.2' }} / ${{ inputs.dtb_source || 'upstream-armbian' }})
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    strategy:
      # One board failing must not cancel the other board's build.
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.validate.outputs.variants) }}

    env:
      WORKSPACE: ${{ github.workspace }}/work
      OUTDIR: ${{ github.workspace }}/work/out
      KERNEL_VERSION: ${{ inputs.kernel_version || '7.2' }}
      DTB_SOURCE: ${{ inputs.dtb_source || 'upstream-armbian' }}
      ROOTFS_SIZE_MB: ${{ inputs.rootfs_size_mb || '6000' }}
      TARGET_HOSTNAME: ${{ inputs.hostname || 'nico-sm8250' }}
      TARGET_ROOT_PASSWORD: ${{ inputs.root_password || 'root' }}
      TARGET_EXTRA_PACKAGES: ${{ inputs.extra_packages || '' }}
      # The variant is carried in RELEASE_NAME so that every artifact name
      # downstream (rootfs img, boot img, checksums, manifest) is namespaced
      # without touching the build scripts:
      #   nico-debian-sm8250-trixie-tc-eb5.boot.img
      #   nico-debian-sm8250-trixie-lite-865.boot.img
      RELEASE_NAME: ${{ inputs.build_release_name || 'trixie' }}-${{ matrix.variant }}
      BOARD_VARIANT: ${{ matrix.variant }}
      DEBIAN_SUITE: trixie
      DEBIAN_MIRROR: http://deb.debian.org/debian
      DEBIAN_SECURITY_MIRROR: http://security.debian.org/debian-security
      SOURCE_DATE_EPOCH: "1700000000"
      # NOTE: the boolean options (enable_ssh / make_default_user) are NOT
      # resolved here. On push events `inputs` is empty, and the idiom
      #   ${{ inputs.x == false && 'false' || 'true' }}
      # evaluates to 'false' in that case (null == false is true in GH
      # expressions), which silently disabled them. They are resolved in the
      # "Resolve build options" step below instead. WITH_NIC_FIX comes from
      # the matrix variant, not from an input.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: intentionally NOT using descriptinc/free-disk-space.
      # That action runs `apt-get remove -y ... google-chrome-stable ...` with no
      # `|| true`; google-chrome-stable is x86-only, so on ubuntu-24.04-arm apt
      # aborts with "E: Unable to locate package" and the step fails.
      - name: Free disk space
        run: bash scripts/free-disk-space.sh

      - name: Resolve build options
        run: |
          set -euo pipefail
          # The board variant decides the NIC fix; it is not a free choice.
          #   tc-eb5   -> DT overlay + out-of-tree helper (PCIe ASM2806/RTL8168)
          #   lite-865 -> neither (USB RTL8153; no ASM2806 to sequence)
          case "$BOARD_VARIANT" in
            tc-eb5)   nic=true ;;
            lite-865) nic=false ;;
            *) echo "ERROR: unknown BOARD_VARIANT '$BOARD_VARIANT'" >&2; exit 1 ;;
          esac
          # Defaults, used for push events where there are no inputs.
          ssh=true; usr=true
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # `inputs.X` renders as the literal string 'true'/'false' here.
            [[ "${{ inputs.enable_ssh }}"        == "false" ]] && ssh=false
            [[ "${{ inputs.make_default_user }}" == "false" ]] && usr=false
          fi
          {
            echo "WITH_NIC_FIX=$nic"
            echo "TARGET_ENABLE_SSH=$ssh"
            echo "TARGET_MAKE_USER=$usr"
          } | tee -a "$GITHUB_ENV"
          echo "resolved: variant=$BOARD_VARIANT nic_fix=$nic ssh=$ssh default_user=$usr"

      - name: Show runner info
        run: |
          set -euo pipefail
          uname -a
          nproc
          free -h
          df -h /
          echo "---- mount points (looking for a bigger scratch fs) ----"
          df -h

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            device-tree-compiler kmod cpio rsync busybox-static \
            debootstrap \
            gdisk e2fsprogs dosfstools parted uuid-runtime \
            android-sdk-libsparse-utils zstd xz-utils \
            python3 python3-pip git curl ca-certificates

      - name: Verify host tools
        run: |
          set -euo pipefail
          fail=0
          # NOTE: mkbootimg is deliberately NOT required. We ship our own
          # header-v0 packer (scripts/mkbootimg.py) because the distro package
          # is v34 and mkbootimg is not on PyPI at all.
          for t in gcc make dtc debootstrap busybox e2fsck mke2fs \
                   sha256sum curl git python3; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '  OK   %-12s %s\n' "$t" "$(command -v "$t")"
            else
              printf '  MISS %-12s\n' "$t"
              fail=1
            fi
          done
          if (( fail )); then
            echo "ERROR: required host tools are missing" >&2
            exit 1
          fi
          echo "boot image packer:"
          python3 scripts/mkbootimg.py --help 2>&1 | head -2

      - name: Show resolved image name
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source config/image.conf
          echo "IMAGE_NAME=$IMAGE_NAME" | tee -a "$GITHUB_ENV"
          echo "DTS_FILE=$DTS_FILE" | tee -a "$GITHUB_ENV"

      - name: Cache kernel source + build tree
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: |
            work/src/linux-${{ env.KERNEL_VERSION }}
            work/build/linux
          # v2: the v1 cache could contain the wrong source tree (a previous
          # fallback checked out a branch HEAD instead of the requested tag).
          # scripts/fetch-kernel.sh now validates the version and refetches if
          # it does not match, but starting from a clean key avoids the
          # pointless download in the first place.
          key: v3-kbuild-${{ matrix.variant }}-${{ env.KERNEL_VERSION }}-${{ env.DTB_SOURCE }}-${{ hashFiles('config/kernel-fragment.config', 'dts/**') }}
          restore-keys: |
            v3-kbuild-${{ matrix.variant }}-${{ env.KERNEL_VERSION }}-${{ env.DTB_SOURCE }}-
            v3-kbuild-${{ matrix.variant }}-${{ env.KERNEL_VERSION }}-

      - name: Prepare directories
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE/src" "$WORKSPACE/build" "$OUTDIR" "$WORKSPACE/rootfs"

      - name: Fetch kernel source
        run: bash scripts/fetch-kernel.sh

      - name: Fetch device tree
        run: bash scripts/fetch-dts.sh

      - name: Preflight DTS check
        run: |
          set -euo pipefail
          # Check the tree this variant will actually ship.
          if [[ "$WITH_NIC_FIX" == "true" ]]; then
            bash scripts/check-dts.sh "$WORKSPACE/src/linux-$KERNEL_VERSION"
          else
            bash scripts/check-dts.sh "$WORKSPACE/src/linux-$KERNEL_VERSION" --no-overlay
          fi

      - name: Build kernel
        run: bash scripts/build-kernel.sh

      - name: Build out-of-tree NIC helper modules
        if: env.WITH_NIC_FIX == 'true'
        run: bash scripts/build-modules.sh

      - name: Build rootfs
        run: bash scripts/build-rootfs.sh

      - name: Pack rootfs into ext4 image
        run: bash scripts/mkrootfs-image.sh

      - name: Pack Android boot images
        run: bash scripts/build-bootimg.sh

      - name: Compress the rootfs image for release
        run: |
          set -euo pipefail
          cd "$OUTDIR"
          # GitHub Releases cap a single asset at 2 GiB, and a 6000 MiB ext4
          # image is far past that. The image is mostly zeros, so gzip brings it
          # well under the limit (the Armbian rootfs images do the same: a
          # ~4.8 GB .img becomes a ~1.6 GB .tar.gz).
          #
          # We ship BOTH:
          #   *.rootfs.img     -> Actions artifact (no size cap, easy to use)
          #   *.rootfs.img.gz  -> release asset (under 2 GiB)
          for img in *.rootfs.img; do
            echo "compressing $img ($(du -h "$img" | cut -f1))"
            gzip -9 -k -f "$img"
            ls -lh "$img" "$img.gz"
          done

          # refuse to publish anything that would fail the release upload
          LIMIT=$(( 2 * 1024 * 1024 * 1024 - 1024 * 1024 ))   # 2 GiB minus slack
          fail=0
          for f in *.img.gz; do
            sz=$(stat -c%s "$f")
            if (( sz >= LIMIT )); then
              echo "ERROR: $f is $(( sz / 1024 / 1024 )) MiB, over the 2 GiB release limit" >&2
              echo "       Lower rootfs_size_mb, or publish via Actions artifacts only." >&2
              fail=1
            fi
          done
          (( fail )) && exit 1
          echo "all release assets are under the 2 GiB limit"

      - name: Generate checksums and manifest
        run: |
          set -euo pipefail
          cd "$OUTDIR"
          # Per-variant names: both variants' assets land in the same release,
          # so a plain "SHA256SUMS" would have one overwrite the other.
          SUMS="SHA256SUMS-${RELEASE_NAME}"
          MANIFEST="MANIFEST-${RELEASE_NAME}.txt"
          sha256sum *.img *.img.gz > "$SUMS"
          cat > "$MANIFEST" <<EOF
          image_name:      ${IMAGE_NAME}
          board_variant:   $BOARD_VARIANT
          kernel_version:  $KERNEL_VERSION
          dtb_source:      $DTB_SOURCE
          with_nic_fix:    $WITH_NIC_FIX
          rootfs_size_mb:  $ROOTFS_SIZE_MB
          release:         $RELEASE_NAME
          target_hostname: $TARGET_HOSTNAME
          enable_ssh:      $TARGET_ENABLE_SSH
          default_user:    $TARGET_MAKE_USER
          git_sha:         $GITHUB_SHA
          git_ref:         $GITHUB_REF_NAME
          run_number:      $GITHUB_RUN_NUMBER
          build_date_utc:  $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          ls -lh
          cat "$MANIFEST"

          # a small file that lists exactly what goes into the release, so the
          # release job never picks up build logs by accident
          cat > RELEASE-ASSETS.txt <<EOF
          ${IMAGE_NAME}-${RELEASE_NAME}.boot.img
          ${IMAGE_NAME}-${RELEASE_NAME}.boot-recovery.img
          ${IMAGE_NAME}-${RELEASE_NAME}.rootfs.img.gz
          $SUMS
          $MANIFEST
          EOF
          echo "---- release assets ($BOARD_VARIANT) ----"
          cat RELEASE-ASSETS.txt

      - name: Upload boot images
        uses: actions/upload-artifact@v4
        with:
          name: boot-images-${{ matrix.variant }}-${{ env.KERNEL_VERSION }}-${{ env.DTB_SOURCE }}
          path: |
            work/out/*.boot.img
            work/out/*.boot-recovery.img
            work/out/SHA256SUMS-*
            work/out/MANIFEST-*.txt
            work/out/RELEASE-ASSETS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload rootfs image
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-image-${{ matrix.variant }}-${{ env.KERNEL_VERSION }}-${{ env.DTB_SOURCE }}
          path: |
            work/out/*.rootfs.img
            work/out/*.rootfs.img.gz
          if-no-files-found: error
          # the .gz is already compressed; don't waste time re-compressing
          compression-level: 0
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.variant }}-${{ env.KERNEL_VERSION }}-${{ env.DTB_SOURCE }}
          path: |
            work/logs/**
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    # The artifact names embed these, so they must be set here too. `env` is
    # per-job in GitHub Actions, not workflow-wide.
    #
    # The board variant is NOT resolved here: both variants' artifacts are
    # matched by glob below, so this job does not need to know which ones ran.
    env:
      KERNEL_VERSION: ${{ inputs.kernel_version || '7.2' }}
      DTB_SOURCE: ${{ inputs.dtb_source || 'upstream-armbian' }}

    steps:
      # Decide first, so a manual run without publish_release=true does no work.
      - name: Resolve release tag
        id: rel
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish_release }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # A manual run only publishes when explicitly asked to.
          if [[ "$EVENT" == "workflow_dispatch" && "$PUBLISH" != "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "manual run without publish_release=true -> not publishing"
            exit 0
          fi
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            TAG="${KERNEL_VERSION}-${DTB_SOURCE}-r${RUN}"
          else
            # push: date + run number keeps tags unique and sortable
            TAG="${KERNEL_VERSION}-${DTB_SOURCE}-$(date -u +%Y%m%d)-r${RUN}"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "will publish as: $TAG"

      # NOTE: the boot-images and rootfs artifacts are downloaded into SEPARATE
      # trees. The rootfs artifact holds both the raw .img (up to
      # ROOTFS_SIZE_MB, way past the 2 GiB per-asset release limit) and the .gz;
      # globbing dist/** would try to upload the raw .img too -- which is
      # exactly what failed before with "size must be less than 2147483648".
      #
      # `pattern:` without merge-multiple puts each artifact in its own
      # subdirectory, so the two variants cannot overwrite each other.
      - name: Download boot images (all variants)
        if: steps.rel.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: boot-images-*
          path: dist

      - name: Download compressed rootfs (all variants)
        if: steps.rel.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: rootfs-image-*
          path: rootfs-artifact

      - name: Assemble release assets
        if: steps.rel.outputs.publish == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release

          lists=(dist/*/RELEASE-ASSETS.txt)
          if [[ ${#lists[@]} -eq 0 ]]; then
            echo "ERROR: no RELEASE-ASSETS.txt in any downloaded artifact" >&2
            ls -R dist rootfs-artifact >&2 || true
            exit 1
          fi

          # keep only what each variant's RELEASE-ASSETS.txt lists
          for list in "${lists[@]}"; do
            d="$(dirname "$list")"
            echo "---- $(basename "$d") ----"
            while read -r f; do
              [[ -z "$f" ]] && continue
              if [[ -f "$d/$f" ]]; then
                cp "$d/$f" release/
                echo "  + $f"
                continue
              fi
              found=0
              for rd in rootfs-artifact/*/; do
                if [[ -f "$rd$f" ]]; then
                  cp "$rd$f" release/
                  echo "  + $f"
                  found=1
                  break
                fi
              done
              if (( ! found )); then
                echo "ERROR: release asset '$f' not found in any artifact" >&2
                exit 1
              fi
            done < "$list"
          done

          echo "---- release payload ----"
          ls -lh release/
          # hard guard: GitHub rejects any asset >= 2 GiB
          fail=0
          for f in release/*; do
            sz=$(stat -c%s "$f")
            if (( sz >= 2 * 1024 * 1024 * 1024 )); then
              echo "ERROR: $f is $(( sz / 1024 / 1024 )) MiB, over the 2 GiB limit" >&2
              fail=1
            fi
          done
          (( fail )) && exit 1
          echo "all assets are under 2 GiB"

      - name: Build release notes
        if: steps.rel.outputs.publish == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "自动构建的 Debian 13 系统镜像。"
            echo
            echo "## 选哪一个"
            echo
            echo "**两个型号的镜像不能混用**：boot.img 里的设备树决定了板子的身份。"
            echo "\`tc-eb5\` 的设备树把 root compatible 改写成 \`thundercomm,eb5\`，"
            echo "板级 helper 模块（\`eb5-board.c\`）正是靠这个判断要不要去跑 ASM2806"
            echo "的 GPIO 上电/PERST 时序。把它刷到 lite-865 上，模块就会在一块没有"
            echo "ASM2806 的板子上驱动 GPIO 82/88…；反过来刷，EB5 的 PCIe 网卡不会起来。"
            echo
            echo '| 型号 | 网卡 | 设备树 | 板级模块 |'
            echo '| --- | --- | --- | --- |'
            echo '| `tc-eb5` | ASM2806 + 2× RTL8168（PCIe1） | 带 NIC-fix overlay，`thundercomm,eb5` | 装 `tc-eb5-pcie-helper` |'
            echo '| `lite-865` | RTL8153（USB） | 仅基础 DTS，`qcom,qrb5165-rb5` | 不装 |'
            echo
            echo "## 产物"
            echo
            echo '| 文件 | 用途 | 刷写命令 |'
            echo '| --- | --- | --- |'
            echo '| `*.boot.img` | Android boot image（内核 + DTB + initramfs） | `fastboot flash boot <file>` |'
            echo '| `*.boot-recovery.img` | 同上，备用槽 | `fastboot flash boot <file>` |'
            echo '| `*.rootfs.img.gz` | ext4 根文件系统（**gzip 压缩，先解压**） | `fastboot flash rootfs <file>` |'
            echo
            echo "> GitHub Release 单个附件上限是 2 GiB，所以 rootfs 以 \`.img.gz\` 形式提供。"
            echo "> 解压：\`gunzip -k <*.rootfs.img.gz>\`。未压缩的 \`.img\` 在 Actions artifact 里。"
            echo
            echo "## 刷机"
            echo
            for m in release/MANIFEST-*.txt; do
              v=$(sed -n 's/^board_variant:[[:space:]]*//p' "$m")
              base=$(sed -n 's/^image_name:[[:space:]]*//p' "$m")
              rel=$(sed -n 's/^release:[[:space:]]*//p' "$m")
              echo "### $v"
              echo
              echo '```bash'
              echo "gunzip -k ${base}-${rel}.rootfs.img.gz"
              echo "fastboot flash rootfs ${base}-${rel}.rootfs.img"
              echo "fastboot flash boot   ${base}-${rel}.boot.img"
              echo 'fastboot reboot'
              echo '```'
              echo
            done
            echo "## 构建信息"
            echo
            for m in release/MANIFEST-*.txt; do
              echo "<details><summary>$(basename "$m")</summary>"
              echo
              echo '```'
              cat "$m"
              echo '```'
              echo
              echo "</details>"
              echo
            done
            echo "## 校验"
            echo
            for s in release/SHA256SUMS-*; do
              echo "<details><summary>$(basename "$s")</summary>"
              echo
              echo '```'
              cat "$s"
              echo '```'
              echo
              echo "</details>"
              echo
            done
            echo "> \`SHA256SUMS-*\` 同时包含解压后的 \`.img\` 和 \`.img.gz\` 的哈希。"
            echo "> 校验压缩包：\`sha256sum -c SHA256SUMS-<型号> --ignore-missing\`"
            echo
            echo "详见仓库里的 \`docs/FLASHING.md\`。"
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: "Debian 13 for DG-SVR-865-TINY / tc-eb5 + lite-865 (${{ inputs.kernel_version || '7.2' }}, ${{ inputs.dtb_source || 'upstream-armbian' }})"
          body_path: release-notes.md
          # explicit directory, NOT dist/** -- dist would also sweep in the raw
          # rootfs .img (over the 2 GiB per-asset limit) and any build logs.
          files: release/*
          draft: false
          prerelease: true
          make_latest: false
