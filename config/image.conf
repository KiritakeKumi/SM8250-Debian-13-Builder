# Image / board identity
#
# Change IMAGE_NAME to rename the produced images and the board helper
# messages. It must stay filesystem-safe (letters, digits, dash, underscore).

IMAGE_NAME="nico-debian-sm8250"

# Device tree file name inside dts/ (without extension handling); the build
# looks for dts/${DTS_FILE}.dts
DTS_FILE="nico-debian-sm8250"

# Upstream device tree (used when DTB_SOURCE=upstream-armbian).
#
# This is the Armbian-maintained mainline DT for the QRB5165 DG SVR 865 Tiny.
# NOTE: Armbian only carries it in the 6.12 and 6.18 kernel patch directories.
# There is no 6.19/7.x copy, so on a 7.x kernel the fetch below fails and
# fetch-dts.sh falls back to the in-repo snapshot -- which we have verified
# compiles against the 7.2 device-tree headers.
UPSTREAM_DTS_URL="https://raw.githubusercontent.com/armbian/build/main/patch/kernel/archive/sm8250-6.18/dt/qcs8250-dg-svr-865-tiny.dts"
UPSTREAM_DTS_URL_FALLBACK="https://raw.githubusercontent.com/armbian/build/main/patch/kernel/archive/sm8250-6.12/dt/qcs8250-dg-svr-865-tiny.dts"

# In-repo snapshot used when the URLs above are unreachable (e.g. a 7.x build).
# The file lives at dts/${DTS_FILE}.dts.
FALLBACK_TO_REPO_SNAPSHOT="true"
